name: Build & Deploy

on:
  push:
    branches: [master]
    paths:
      - 'IzolluCRM/IzolluDayanismaMerkezi/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: IzolluCRM/IzolluDayanismaMerkezi
          file: IzolluCRM/IzolluDayanismaMerkezi/Dockerfile
          push: true
          tags: |
            ghcr.io/izolluvakfi/izolludayanismamerkezi:latest
            ghcr.io/izolluvakfi/izolludayanismamerkezi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Railway deploy
        env:
          HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
